[versions]
agp = "9.4.1"
gson = "2.14.0"
simple-xml = "2.7.1"
appcompat = "1.8.0"
constraintlayout = "2.2.2"
core = "1.19.1"
fragment = "1.9.1"
preference = "1.2.1"
coordinatorlayout = "1.3.0"
drawerlayout = "1.2.0"
material = "1.14.0"
test-runner = "1.7.0"
test-rules = "1.7.0"
test-core = "1.7.0"
test-junit = "1.3.0"
espresso = "3.7.0"

[libraries]
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
androidx-constraintlayout = { module = "androidx.constraintlayout:constraintlayout", version.ref = "constraintlayout" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "core" }
androidx-fragment-ktx = { module = "androidx.fragment:fragment-ktx", version.ref = "fragment" }
androidx-preference-ktx = { module = "androidx.preference:preference-ktx", version.ref = "preference" }
androidx-coordinatorlayout = { module = "androidx.coordinatorlayout:coordinatorlayout", version.ref = "coordinatorlayout" }
androidx-drawerlayout = { module = "androidx.drawerlayout:drawerlayout", version.ref = "drawerlayout" }
material = { module = "com.google.android.material:material", version.ref = "material" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
simple-xml = { module = "org.simpleframework:simple-xml", version.ref = "simple-xml" }
test-runner = { module = "androidx.test:runner", version.ref = "test-runner" }
test-rules = { module = "androidx.test:rules", version.ref = "test-rules" }
test-core-ktx = { module = "androidx.test:core-ktx", version.ref = "test-core" }
test-junit = { module = "androidx.test.ext:junit", version.ref = "test-junit" }
test-espresso = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }

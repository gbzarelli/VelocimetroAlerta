plugins {
    alias(libs.plugins.android.application)
}

def releaseSigningValues = [
        storeFile    : System.getenv('VEL_ALERT_UPLOAD_STORE_FILE'),
        storePassword: System.getenv('VEL_ALERT_UPLOAD_STORE_PASSWORD'),
        keyAlias     : System.getenv('VEL_ALERT_UPLOAD_KEY_ALIAS'),
        keyPassword  : System.getenv('VEL_ALERT_UPLOAD_KEY_PASSWORD')
]
def hasReleaseSigning = releaseSigningValues.values().every { it != null && !it.trim().isEmpty() }

android {
    namespace = 'br.com.helpdev.velocimetroalerta'
    compileSdk {
        version = release(36) {
            minorApiLevel = 1
        }
    }

    buildFeatures {
        viewBinding = true
    }

    defaultConfig {
        applicationId = 'br.com.helpdev.velocimetroalerta'
        minSdk = 23
        targetSdk = 36
        versionCode = 13
        versionName = '4.2'
        testInstrumentationRunner = 'androidx.test.runner.AndroidJUnitRunner'
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    signingConfigs {
        if (hasReleaseSigning) {
            create('playStore') {
                storeFile = file(releaseSigningValues.storeFile)
                storePassword = releaseSigningValues.storePassword
                keyAlias = releaseSigningValues.keyAlias
                keyPassword = releaseSigningValues.keyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig = signingConfigs.getByName('playStore')
            }
        }
    }
}

dependencies {
    implementation(libs.androidx.appcompat)
    implementation(libs.androidx.constraintlayout)
    implementation(libs.androidx.core.ktx)
    implementation(libs.androidx.fragment.ktx)
    implementation(libs.androidx.preference.ktx)
    implementation(libs.androidx.coordinatorlayout)
    implementation(libs.androidx.drawerlayout)
    implementation(libs.material)
    implementation(libs.gson)
    testImplementation(libs.junit)
    androidTestImplementation(libs.test.runner)
    androidTestImplementation(libs.test.rules)
    androidTestImplementation(libs.test.core.ktx)
    androidTestImplementation(libs.test.junit)
    androidTestImplementation(libs.test.espresso)
    androidTestImplementation(libs.test.espresso.intents)
    androidTestImplementation(libs.test.uiautomator)
}
